services:
  - type: web
    name: cocktail-gpt-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        value: https://${RENDER_EXTERNAL_HOSTNAME}/api/spotify/callback
      - key: SPOTIFY_FRONTEND_REDIRECT_URL
        sync: false
      - key: SPOTIFY_STATE_SECRET
        sync: false
      - key: SPOTIFY_CACHE_DIR
        value: /tmp/.spotify_cache
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: DEFAULT_LAT
        value: "40.7128"
      - key: DEFAULT_LON
        value: "-74.0060"
      - key: LLM_MODEL
        value: anthropic/claude-sonnet-4-5
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_SITE_URL
        value: https://${RENDER_EXTERNAL_HOSTNAME}
      - key: OPENROUTER_SITE_NAME
        value: cocktail-agent
      - key: CLARIFY_THRESHOLD
        value: "0.65"
      - key: DATABASE_URL
        fromDatabase:
          name: cocktail-gpt-db
          property: connectionString

databases:
  - name: cocktail-gpt-db
    databaseName: cocktail_gpt
    user: cocktail_user
    region: oregon

envVarGroups:
  - name: API Keys
    envVars:
      - SPOTIFY_CLIENT_ID
      - SPOTIFY_CLIENT_SECRET
      - SPOTIFY_STATE_SECRET
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - OPENWEATHER_API_KEY
      - OPENROUTER_API_KEY
      - SPOTIFY_FRONTEND_REDIRECT_URL
